# Butterfly 主题覆盖配置（只写与默认不同的项）

# 首页头图：hero 区背景（source/img/background.jpg，构建后访问 /img/background.jpg）
index_img: /img/background.jpg

# 全站网页背景（#web_bg 层，position:fixed; z-index:-999，background-size:cover 铺满视口）
# 与 index_img 是两个独立配置：index_img 只管首页顶部 banner，这里是整页背景
# 注意：文章卡片 .card 默认纯白不透明（--card-bg: $white），背景图只在页面两侧留白与卡片缝隙可见
background: /img/bg-body.jpg

# 浏览量统计：Vercount 替换不蒜子（busuanzi.ibruce.info 已失效，导致一直转圈）
# Vercount 与不蒜子 span 标签（busuanzi_value_*）完全兼容，免注册，国内可直连
busuanzi:
  site_uv: true   # 全站访客数
  site_pv: true   # 全站访问量
  page_pv: true   # 文章阅读量

# 首页文章卡片摘要：1 = 使用 front-matter 的 description 字段（默认 3 = 全文截 500 字，不认 <!-- more -->）
index_post_content:
  method: 1

# CDN.option 会在运行时并入 theme.asset（见 scripts/events/cdn.js），覆盖默认的不蒜子脚本地址
CDN:
  option:
    busuanzi: https://cn.vercount.one/js

# 侧栏公告
aside:
  card_announcement:
    content: 这是 simp1est 的博客，随缘更新
  # 作者卡片 Follow Me 按钮 → GitHub 主页（不写则主题默认跳 github.com/xxxxxx 占位符）
  card_author:
    button:
      link: https://github.com/simp1est

# 自定义样式注入：source/css/custom.css
# 用途：卡片 / 顶部 banner / footer 半透明，让 background 背景图能透出来
#
# ⚠️ 改完 custom.css 必须同步改下面的 ?v= 版本号
# 原因：GitHub Pages 对 css 的缓存是 max-age=600，URL 不变的话访客浏览器
# 会沿用旧样式最多 10 分钟。改了版本号等于换 URL，所有人立即拿到新样式。
inject:
  head:
    - '<link rel="stylesheet" href="/css/custom.css?v=20261115-2">'
